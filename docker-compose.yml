services:
  postgres:
    image: postgres:18-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaForte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  auth-service:
    build:
      context: ./services/auth-service/AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081
      ASPNETCORE_HTTPS_PORT: ${AUTH_SERVICE_HTTPS_PORT:-8081}
      ASPNETCORE_Kestrel__Certificates__Default__Path: ${AUTH_KESTREL_CERT_PATH:-/https/aspnetapp.pfx}
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${AUTH_KESTREL_CERT_PASSWORD:-dev-cert-password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-auth_service};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-SenhaForte}
      Authentication__LoginUrl: ${AUTH_LOGIN_URL:-http://localhost:3000/login}
      AdminSeed__Name: ${ADMIN_SEED_NAME:-Administrador}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-admin@authservice.local}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-AdminPassword123!}
      OpenIddict__Certificates__SigningPath: ${OPENIDDICT_SIGNING_CERT_PATH:-}
      OpenIddict__Certificates__SigningPassword: ${OPENIDDICT_SIGNING_CERT_PASSWORD:-}
      OpenIddict__Certificates__EncryptionPath: ${OPENIDDICT_ENCRYPTION_CERT_PATH:-}
      OpenIddict__Certificates__EncryptionPassword: ${OPENIDDICT_ENCRYPTION_CERT_PASSWORD:-}
      OpenIddict__Clients__0__ClientId: ${OPENIDDICT_WEB_CLIENT_ID:-web-client}
      OpenIddict__Clients__0__ClientSecret: ${OPENIDDICT_WEB_CLIENT_SECRET:-}
      OpenIddict__Clients__0__DisplayName: ${OPENIDDICT_WEB_CLIENT_DISPLAY_NAME:-Web Application Client}
      OpenIddict__Clients__0__RedirectUris__0: ${OPENIDDICT_WEB_CLIENT_REDIRECT_URI:-http://localhost:3000/callback}
      OpenIddict__Clients__0__PostLogoutRedirectUris__0: ${OPENIDDICT_WEB_CLIENT_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000}
      OpenIddict__Clients__0__GrantTypes__0: authorization_code
      OpenIddict__Clients__0__GrantTypes__1: refresh_token
      OpenIddict__Clients__0__Scopes__0: openid
      OpenIddict__Clients__0__Scopes__1: email
      OpenIddict__Clients__0__Scopes__2: profile
      OpenIddict__Clients__0__Scopes__3: roles
      OpenIddict__Clients__0__Scopes__4: offline_access
      OpenIddict__Clients__0__RequirePkce: ${OPENIDDICT_WEB_CLIENT_REQUIRE_PKCE:-true}
    ports:
      - "${AUTH_SERVICE_PORT:-8080}:8080"
      - "${AUTH_SERVICE_HTTPS_PORT:-8081}:8081"
    volumes:
      - ${AUTH_HTTPS_CERTS_DIR:-./certs}:/https:ro
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/monitoramento
      dockerfile: Dockerfile
    container_name: monitoramento
    restart: unless-stopped
    depends_on:
      - auth-service
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-https://auth-service:8081}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
